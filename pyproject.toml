[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calls with constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy",
    "pydantic",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/llm_sdk"

[[tool.mypy.overrides]]
module = "llm_sdk"
follow_imports = "skip"
